name: discord-pr

# ci 워크플로가 끝난 뒤 실행됨
on:
  workflow_run:
    workflows: [ci]
    types: [completed]

permissions:
  issues: write
  pull-requests: write

jobs:
  notify:
    name: notify discord
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      # 웹훅 URL에 ?thread_id=가 붙어 있으므로 payload는 content만 보냄
      - name: Send message
        env:
          WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.workflow_run.pull_requests[0].number }}
          RUN_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          NOTIFIED_LABEL: discord-notified
        run: |
          if [ -z "$WEBHOOK_URL" ]; then
            echo "DISCORD_WEBHOOK_URL secret이 없어 알림을 건너뜁니다."
            exit 0
          fi
          if [ -z "$PR_NUMBER" ]; then
            echo "연결된 PR이 없어 건너뜁니다."
            exit 0
          fi

          pr=$(gh api "repos/$REPO/pulls/$PR_NUMBER")
          state=$(jq -r '.state' <<<"$pr")
          draft=$(jq -r '.draft' <<<"$pr")
          head_sha=$(jq -r '.head.sha' <<<"$pr")
          notified=$(jq --arg l "$NOTIFIED_LABEL" '[.labels[].name] | index($l) != null' <<<"$pr")

          if [ "$state" != "open" ] || [ "$draft" = "true" ] || [ "$notified" = "true" ]; then
            echo "건너뜀: state=$state draft=$draft notified=$notified"
            exit 0
          fi
          # 통과한 CI가 PR의 최신 커밋 기준일 때만 알림
          if [ "$head_sha" != "$RUN_HEAD_SHA" ]; then
            echo "최신 커밋의 CI가 아니라 건너뜁니다."
            exit 0
          fi

          # 메시지 형식:
          #   <타입 뺀 제목> 완료되어 PR 요청드립니다.
          #   (빈 줄)
          #   <PR 제목 전체> (작성자)
          #   <PR 링크>
          payload=$(jq '
            (.title | sub("^[A-Za-z]+(\\([^)]*\\))?!?:\\s*"; "") | gsub("^\\s+|\\s+$"; "")) as $summary
            | {
                content: "\($summary) 완료되어 PR 요청드립니다.\n\n\(.title) (\(.user.login))\n\(.html_url)",
                allowed_mentions: {parse: []}
              }' <<<"$pr")
          curl -sS --fail-with-body -X POST \
            -H "Content-Type: application/json" \
            -d "$payload" \
            "$WEBHOOK_URL"

          gh api -X POST "repos/$REPO/issues/$PR_NUMBER/labels" \
            -f "labels[]=$NOTIFIED_LABEL" >/dev/null
